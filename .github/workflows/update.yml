name: Update Stock Data

on:
schedule:
- cron: '*/15 0-6 * * 1-5'
workflow_dispatch:

permissions:
contents: write

jobs:
update:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: |
      pip install requests beautifulsoup4

  - name: Run updater
    run: |
      python update.py

  - name: Commit changes
    run: |
      git config user.name "github-actions"
      git config user.email "github-actions@github.com"

      git add stocks.json

      git diff --cached --quiet || git commit -m "Auto update stocks"

      git push
