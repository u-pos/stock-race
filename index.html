<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>売買代金TOP50 騰落率レースボード</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:sans-serif;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#000;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #333;
}

h1{
    margin:0;
    font-size:32px;
}

#clock{
    font-size:40px;
    font-weight:bold;
}

.container{
    background:#fff;
    color:#000;
}

.scale{
    position:sticky;
    top:76px;
    z-index:50;
    background:white;
    height:40px;
    border-bottom:2px solid #ddd;
}

.scale-inner{
    position:relative;
    width:100%;
    height:100%;
}

.scale-inner span{
    position:absolute;
    top:10px;
    transform:translateX(-50%);
    font-weight:bold;
}

.scale0{
    left:50%;
}

.scale10{
    left:75%;
}

.scale20{
    left:100%;
}

.scaleM10{
    left:25%;
}

.scaleM20{
    left:0%;
}

.zero-line{
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:4px;
    background:#333;
}

.row{
    display:flex;
    min-height:42px;
    border-bottom:1px solid #eee;
}

.info{
    width:280px;
    padding:8px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:18px;
}

.rank{
    width:40px;
    text-align:right;
}

.name{
    width:130px;
}

.change{
    width:80px;
    text-align:right;
    font-weight:bold;
}

.race{
    flex:1;
    position:relative;
    background:
    repeating-linear-gradient(
        to bottom,
        #fafafa,
        #fafafa 40px,
        #f0f0f0 41px
    );
}

.horse{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:26px;
}

.plus{
    color:#0b8f2a;
}

.minus{
    color:#d80000;
}

.minus-horse{
    transform:translateY(-50%) scaleX(-1);
}

</style>
</head>
<body>

<header>
    <h1>売買代金TOP50 騰落率レースボード</h1>
    <div id="clock"></div>
</header>

<div class="container">

    <div class="scale">
        <div class="scale-inner">
            <span class="scaleM20">-20%</span>
            <span class="scaleM10">-10%</span>
            <span class="scale0">0%</span>
            <span class="scale10">+10%</span>
            <span class="scale20">+20%</span>
            <div class="zero-line"></div>
        </div>
    </div>

    <div id="rows"></div>

</div>

<script>

const stocks=[];

for(let i=1;i<=25;i++){
    stocks.push({
        rank:i,
        name:"銘柄"+i,
        change:(12-(i*0.45))
    });
}

for(let i=26;i<=50;i++){
    stocks.push({
        rank:i,
        name:"銘柄"+i,
        change:-(0.2+(i-26)*0.35)
    });
}

stocks.sort((a,b)=>b.change-a.change);

const rows=document.getElementById("rows");

stocks.forEach((stock,index)=>{

    const row=document.createElement("div");
    row.className="row";

    const info=document.createElement("div");
    info.className="info";

    const colorClass=stock.change>=0
        ? "plus"
        : "minus";

    info.innerHTML=`
        <div class="rank">${index+1}</div>
        <div class="name">${stock.name}</div>
        <div class="change ${colorClass}">
            ${stock.change>0?'+':''}${stock.change.toFixed(2)}%
        </div>
    `;

    const race=document.createElement("div");
    race.className="race";

    const zero=50;

    let pos;

    if(stock.change>=0){

        pos=50+(stock.change/20)*50;

    }else{

        pos=50-(Math.abs(stock.change)/20)*50;

    }

    const horse=document.createElement("div");

    horse.className=
        stock.change>=0
        ? "horse plus"
        : "horse minus minus-horse";

    horse.style.left=`calc(${pos}% - 12px)`;

    horse.innerHTML="🐎";

    race.appendChild(horse);

    row.appendChild(info);
    row.appendChild(race);

    rows.appendChild(row);

});

function updateClock(){

    const now=new Date();

    document.getElementById("clock").innerHTML=
        now.toLocaleTimeString("ja-JP");
}

updateClock();
setInterval(updateClock,1000);

</script>

</body>
</html>
