<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>売買代金TOP50 騰落率レースボード</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:sans-serif;
    background:#fff;
    color:#111;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#000;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 20px;
}

h1{
    font-size:40px;
}

#clock{
    font-size:40px;
    font-weight:bold;
}

#board{
    position:relative;
}

.scale{
    position:sticky;
    top:72px;
    z-index:999;
    height:40px;
    background:#fff;
    border-bottom:1px solid #ddd;
}

.scale-grid{
    position:absolute;
    left:300px;
    right:0;
    top:0;
    bottom:0;
}

.scale-grid span{
    position:absolute;
    top:8px;
    transform:translateX(-50%);
    font-weight:bold;
    font-size:24px;
}

.row{
    display:flex;
    height:28px;
    border-bottom:1px solid rgba(0,0,0,.05);
}

.row.plus-row{
    background:rgba(0,180,0,.05);
}

.row.minus-row{
    background:rgba(255,0,0,.05);
}

.left{
    width:300px;
    display:flex;
    align-items:center;
    gap:8px;
    padding-left:8px;
    font-size:15px;
}

.rank{
    width:40px;
    font-weight:bold;
}

.name{
    width:150px;
}

.change{
    width:80px;
    text-align:right;
    font-weight:bold;
}

.plus{
    color:#0b8f2a;
}

.minus{
    color:#d00000;
}

.race{
    flex:1;
    position:relative;
}

.horse{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:18px;
    line-height:1;
}

.horse.minus{
    transform:translateY(-50%) scaleX(-1);
}

.zero-line{
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:3px;
    background:#000;
    z-index:10;
}

.grid{
    position:absolute;
    top:0;
    bottom:0;
    width:1px;
    background:#ddd;
}

.footer{
    text-align:center;
    padding:15px;
    color:#666;
}

</style>
</head>
<body>

<header>
    <h1>売買代金 TOP50 騰落率レースボード</h1>
    <div id="clock"></div>
</header>

<div id="board">

    <div class="scale">

        <div class="scale-grid">

            <span style="left:5%; color:red;">-20%</span>
            <span style="left:25%; color:red;">-10%</span>
            <span style="left:50%;">0%</span>
            <span style="left:75%; color:green;">+10%</span>
            <span style="left:95%; color:green;">+20%</span>

        </div>

    </div>

    <div id="rows"></div>

</div>

<div class="footer">
    データは1分毎に更新予定
</div>

<script>

const stocks = [];

for(let i=1;i<=25;i++){

    stocks.push({
        name:"銘柄"+i,
        change:12 - ((i-1)*0.45)
    });

}

for(let i=26;i<=50;i++){

    stocks.push({
        name:"銘柄"+i,
        change:-0.12 - ((i-26)*0.34)
    });

}

stocks.sort((a,b)=>b.change-a.change);

const rows = document.getElementById("rows");

stocks.forEach((stock,index)=>{

    const row=document.createElement("div");

    row.className=
        stock.change>=0
        ? "row plus-row"
        : "row minus-row";

    const left=document.createElement("div");

    left.className="left";

    left.innerHTML=`
        <div class="rank">${index+1}</div>
        <div class="name">${stock.name}</div>
        <div class="change ${stock.change>=0?'plus':'minus'}">
            ${stock.change>0?'+':''}${stock.change.toFixed(2)}%
        </div>
    `;

    const race=document.createElement("div");

    race.className="race";

    const zero=document.createElement("div");
    zero.className="zero-line";
    race.appendChild(zero);

    [5,25,50,75,95].forEach(pos=>{

        const grid=document.createElement("div");

        grid.className="grid";
        grid.style.left=pos+"%";

        race.appendChild(grid);

    });

    let pos;

    if(stock.change>=0){

        pos = 50 + (stock.change/20)*45;

    }else{

        pos = 50 - (Math.abs(stock.change)/20)*45;

    }

    const horse=document.createElement("div");

    horse.className=
        stock.change>=0
        ? "horse plus"
        : "horse minus";

    horse.style.left=`calc(${pos}% - 10px)`;

    horse.innerHTML="🐎";

    race.appendChild(horse);

    row.appendChild(left);
    row.appendChild(race);

    rows.appendChild(row);

});

function updateClock(){

    const now=new Date();

    document.getElementById("clock").textContent=
        now.toLocaleTimeString("ja-JP");

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>
</html>
